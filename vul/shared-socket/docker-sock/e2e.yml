name: docker-socket
test_envs:
  - name: docker-v28.3.2
    kind: dqd
    dqd_dir: docker/v28.3.2
    pkg: github.com/ctrsploit/ctrsploit/vul/shared-socket/docker-sock
    cmd: echo flag{proof} > /flag && docker run -v /ctrsploit.test:/ctrsploit.test
      --env TEST_ENV=docker.sock
      -v /var/run/docker.sock:/var/run/docker.sock
      busybox:latest
      /ctrsploit.test -test.v -test.run '^TestE2E'
