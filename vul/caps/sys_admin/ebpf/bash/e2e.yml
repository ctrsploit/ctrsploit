name: bash
test_envs:
  - name: CAP_SYS_ADMIN
    remote_host: docker-v28.3.2-cron
    kind: dqd
    dqd_dir: docker/v28.3.2-cron
    pkg: github.com/ctrsploit/ctrsploit/vul/caps/sys_admin/ebpf/bash
    cmd: docker run --rm
      -v /ctrsploit.test:/ctrsploit.test
      --env TEST_ENV=CAP_SYS_ADMIN
      --cap-add CAP_SYS_ADMIN
      -v /:/host
      busybox:latest
      /ctrsploit.test -test.v -test.run '^TestE2E_Exploit$'
  - name: CAP_BPF__CAP_PERFMON
    remote_host: docker-v28.3.2-cron
    kind: dqd
    dqd_dir: docker/v28.3.2-cron
    pkg: github.com/ctrsploit/ctrsploit/vul/caps/sys_admin/ebpf/bash
    cmd: docker run --rm
      -v /ctrsploit.test:/ctrsploit.test
      --env TEST_ENV=CAP_BPF+CAP_PERFMON
      --cap-add CAP_BPF
      --cap-add CAP_PERFMON
      -v /:/host
      busybox:latest
      /ctrsploit.test -test.v -test.run '^TestE2E_Exploit$'