name: kubelet
test_envs:
  - name: CAP_SYS_ADMIN
    remote_host: kubernetes-v1.33.1-calico
    kind: dqd
    dqd_dir: kubernetes/v1.33.1-calico
    pkg: github.com/ctrsploit/ctrsploit/vul/caps/sys_admin/ebpf/kubelet
    cmd: |
      until kubectl wait --for=condition=Ready pod --all -A --timeout=30s; do sleep 10; done
      cat <<EOF | kubectl apply -f -
      apiVersion: batch/v1
      kind: Job
      metadata:
        name: test-job
      spec:
        backoffLimit: 0
        template:
          spec:
            restartPolicy: Never
            containers:
              - name: test-container
                image: busybox:latest
                tty: true
                env: 
                  - name: TEST_ENV
                    value: CAP_SYS_ADMIN
                command: ["/ctrsploit.test", "-test.v", "-test.run", "^TestE2E_Exploit$"]
                securityContext:
                  capabilities:
                    add:
                      - "SYS_ADMIN"
                volumeMounts:
                  - name: volume
                    mountPath: /ctrsploit.test
            volumes:
              - name: volume
                hostPath:
                  path: /ctrsploit.test
                  type: File
      EOF
      echo "Waiting for job 'test-job' to complete..."
      kubectl wait --for=condition=complete job/test-job --timeout=120s
      POD_NAME=$(kubectl get pods -l job-name=test-job -o jsonpath='{.items[0].metadata.name}')
      kubectl logs $POD_NAME
