name: ptrace-pid-host
test_envs:
  - name: docker-v28.3.2
    kind: dqd
    dqd_dir: docker/v28.3.2
    pkg: github.com/ctrsploit/ctrsploit/vul/caps/sys_ptrace/pid_host
    cmd: docker run -v /ctrsploit.test:/ctrsploit.test
      --env TEST_ENV=exploitable
      --cap-add CAP_SYS_PTRACE
      --pid=host
      --security-opt apparmor=unconfined
      busybox:latest
      /ctrsploit.test -test.v -test.run '^TestE2E'
  - name: docker-v28.3.2
    kind: dqd
    dqd_dir: docker/v28.3.2
    pkg: github.com/ctrsploit/ctrsploit/vul/caps/sys_ptrace/pid_host
    cmd: docker run -v /ctrsploit.test:/ctrsploit.test
      --env TEST_ENV=apparmor
      --cap-add CAP_SYS_PTRACE
      --pid=host
      busybox:latest
      /ctrsploit.test -test.v -test.run '^TestE2E'
