name: naked
test_envs:
  - name: docker-v28.3.2
    kind: dqd
    dqd_dir: docker/v28.3.2
    pkg: github.com/ctrsploit/ctrsploit/prerequisite/namespace
    cmd: docker run -v /ctrsploit.test:/ctrsploit.test
      --env TEST_ENV=pid-host
      --pid=host
      busybox:latest
      /ctrsploit.test -test.v -test.run '^TestE2E'
  - name: docker-v28.3.2
    kind: dqd
    dqd_dir: docker/v28.3.2
    pkg: github.com/ctrsploit/ctrsploit/prerequisite/namespace
    cmd: docker run -v /ctrsploit.test:/ctrsploit.test
      --env TEST_ENV=pid-default
      busybox:latest
      /ctrsploit.test -test.v -test.run '^TestE2E'
