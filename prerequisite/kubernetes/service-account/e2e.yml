name: service-account
test_envs:
  - name: kubernetes-v1.34.0-calico
    kind: dqd
    dqd_dir: kubernetes/v1.34.0-calico
    pkg: github.com/ctrsploit/ctrsploit/prerequisite/kubernetes/service-account
    cmd: |
      until kubectl wait --for=condition=Ready pod --all -A --timeout=30s; do sleep 10; done
      cat <<EOF | kubectl apply -f -
      apiVersion: batch/v1
      kind: Job
      metadata:
        name: test-job
      spec:
        template:
          spec:
            restartPolicy: Never
            containers:
              - name: test-container
                image: busybox:latest
                tty: true
                env: 
                  - name: TEST_ENV
                    value: mounted
                command: ["/ctrsploit.test", "-test.v", "-test.run", "^TestE2E_ServiceAccount$"]
                volumeMounts:
                  - name: volume
                    mountPath: /ctrsploit.test
            volumes:
              - name: volume
                hostPath:
                  path: /ctrsploit.test
                  type: File
      EOF
      echo "Waiting for job 'test-job' to complete..."
      kubectl wait --for=condition=complete job/test-job --timeout=120s
      POD_NAME=$(kubectl get pods -l job-name=test-job -o jsonpath='{.items[0].metadata.name}')
      kubectl logs $POD_NAME
  - name: kubernetes-v1.34.0-calico
    kind: dqd
    dqd_dir: kubernetes/v1.34.0-calico
    pkg: github.com/ctrsploit/ctrsploit/prerequisite/kubernetes/service-account
    cmd: |
      until kubectl wait --for=condition=Ready pod --all -A --timeout=30s; do sleep 10; done
      cat <<EOF | kubectl apply -f -
      apiVersion: batch/v1
      kind: Job
      metadata:
        name: test-job
      spec:
        template:
          spec:
            automountServiceAccountToken: false
            restartPolicy: Never
            containers:
              - name: test-container
                image: busybox:latest
                tty: true
                env: 
                  - name: TEST_ENV
                    value: not_mounted
                command: ["/ctrsploit.test", "-test.v", "-test.run", "^TestE2E_ServiceAccount$"]
                volumeMounts:
                  - name: volume
                    mountPath: /ctrsploit.test
            volumes:
              - name: volume
                hostPath:
                  path: /ctrsploit.test
                  type: File
      EOF
      echo "Waiting for job 'test-job' to complete..."
      kubectl wait --for=condition=complete job/test-job --timeout=120s
      POD_NAME=$(kubectl get pods -l job-name=test-job -o jsonpath='{.items[0].metadata.name}')
      kubectl logs $POD_NAME
