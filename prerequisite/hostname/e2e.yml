name: mountinfo
test_envs:
  - name: docker-v28.3.2
    kind: dqd
    dqd_dir: docker/v28.3.2
    pkg: github.com/ctrsploit/ctrsploit/prerequisite/hostname
    cmd: docker run --rm
      -v /ctrsploit.test:/ctrsploit.test
      --env TEST_ENV=docker-v28.3.2
      busybox:latest
      /ctrsploit.test -test.v -test.run '^TestE2E_K8sHostnameMatch$'
  - name: kubernetes-v1.33.1-calico
    kind: dqd
    dqd_dir: kubernetes/v1.33.1-calico
    pkg: github.com/ctrsploit/ctrsploit/prerequisite/hostname
    cmd: |
      until kubectl wait --for=condition=Ready pod --all -A --timeout=30s; do sleep 10; done
      cat <<EOF | kubectl apply -f -
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: test-deploy
      spec:
        replicas: 1
        selector:
          matchLabels:
            app: test
        template:
          metadata:
            labels:
              app: test
          spec:
            containers:
              - name: test-container
                image: busybox:latest
                tty: true
                env:
                  - name: TEST_ENV
                    value: kubernetes-v1.33.1-calico
                command: ["/bin/sh", "-c", "/ctrsploit.test -test.v -test.run '^TestE2E_K8sHostnameMatch$' && sleep inf"]
                volumeMounts:
                  - name: volume
                    mountPath: /ctrsploit.test
            volumes:
              - name: volume
                hostPath:
                  path: /ctrsploit.test
                  type: File
      EOF
      echo "Waiting for pod Ready"
      kubectl wait --for=condition=available deploy/test-deploy --timeout=120s
      kubectl logs -l app=test
  - name: nerdctl-v2.1.2
    kind: dqd
    dqd_dir: nerdctl/v2.1.2
    pkg: github.com/ctrsploit/ctrsploit/prerequisite/hostname
    cmd: nerdctl run --rm -q
      -v /ctrsploit.test:/ctrsploit.test
      --env TEST_ENV=nerdctl-v2.1.2
      busybox:latest
      /ctrsploit.test -test.v -test.run '^TestE2E_K8sHostnameMatch$'