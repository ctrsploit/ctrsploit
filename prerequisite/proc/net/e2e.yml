name: mount
test_envs:
  - name: docker-v28.3.2-default
    remote_host: docker-v28.3.2
    kind: dqd
    dqd_dir: docker/v28.3.2
    pkg: github.com/ctrsploit/ctrsploit/prerequisite/proc/net
    cmd: docker run --rm
      -v /ctrsploit.test:/ctrsploit.test
      --env TEST_ENV=docker-v28.3.2-default
      busybox:latest
      /ctrsploit.test -test.v -test.run '^TestE2E'
  - name: docker-v28.3.2-host-ns
    remote_host: docker-v28.3.2
    kind: dqd
    dqd_dir: docker/v28.3.2
    pkg: github.com/ctrsploit/ctrsploit/prerequisite/proc/net
    cmd: docker run --rm
      -v /ctrsploit.test:/ctrsploit.test
      --net=host
      --env TEST_ENV=docker-v28.3.2-host-ns
      busybox:latest
      /ctrsploit.test -test.v -test.run '^TestE2E'
