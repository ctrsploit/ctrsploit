name: syscall
test_envs:
  - name: docker-v28.3.2
    kind: dqd
    dqd_dir: docker/v28.3.2
    pkg: github.com/ctrsploit/ctrsploit/prerequisite/syscall
    cmd: docker run -v /ctrsploit.test:/ctrsploit.test
      --env TEST_ENV=seccomp-enabled
      busybox:latest
      /ctrsploit.test -test.v -test.run '^TestE2E'
  - name: docker-v28.3.2
    kind: dqd
    dqd_dir: docker/v28.3.2
    pkg: github.com/ctrsploit/ctrsploit/prerequisite/syscall
    cmd: docker run -v /ctrsploit.test:/ctrsploit.test
      --env TEST_ENV=seccomp-unconfined
      --security-opt seccomp=unconfined
      busybox:latest
      /ctrsploit.test -test.v -test.run '^TestE2E'