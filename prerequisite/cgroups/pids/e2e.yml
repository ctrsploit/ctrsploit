name: cgroups
test_envs:
  - name: fork-bomb
    kind: dqd
    dqd_dir: vul/fork-bomb
    pkg: github.com/ctrsploit/ctrsploit/prerequisite/cgroups/pids
    cmd: docker run --rm
      -v /ctrsploit.test:/ctrsploit.test
      --env TEST_ENV=unlimited
      busybox:latest
      /ctrsploit.test -test.v -test.run "^TestE2E_UnlimitedPidsMax$"
  - name: docker-v19.03.13
    kind: dqd
    dqd_dir: docker/v19.03.13
    pkg: github.com/ctrsploit/ctrsploit/prerequisite/cgroups
    cmd: docker run --rm
      -v /ctrsploit.test:/ctrsploit.test
      --env TEST_ENV=limited
      --pids-limit=1000
      busybox:latest
      /ctrsploit.test -test.v -test.run "^TestE2E_UnlimitedPidsMax$"