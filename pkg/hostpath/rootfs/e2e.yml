name: rootfs
test_envs:
  - name: docker-v23.0.0-devicemapper
    kind: dqd
    dqd_dir: docker/v23.0.0-devicemapper
    pkg: github.com/ctrsploit/ctrsploit/pkg/hostpath/rootfs
    cmd: docker run --rm
      -v /ctrsploit.test:/ctrsploit.test
      --env TEST_ENV=docker-v23.0.0-devicemapper
      busybox:latest
      /ctrsploit.test -test.v -test.run '^TestE2E_DockerDeviceMapper$'
  - name: docker-v28.3.2
    kind: dqd
    dqd_dir: docker/v28.3.2
    pkg: github.com/ctrsploit/ctrsploit/pkg/hostpath/rootfs
    cmd: docker run --rm
      -v /ctrsploit.test:/ctrsploit.test
      --env TEST_ENV=docker-v28.3.2
      busybox:latest
      /ctrsploit.test -test.v -test.run '^TestE2E_DockerOverlay$'
